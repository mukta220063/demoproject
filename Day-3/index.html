<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="">
        <table>
            <tr>
                <td>
                    <label for="name">Enter your name</label>
                </td>
                <td>:</td>
                <td>
                    <input type="text" id="name" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Enter your email</label>
                </td>
                <td>:</td>
                <td>
                    <input type="email" id="email" required>
                    
                </td>
            </tr>
            <tr>
                <td>
                    <label for="phone">Enter Mobile</label>
                </td>
                <td>:</td>
                <td>
                    <input type="number" id="phone">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dob">Date of bath</label>
                </td>
                <td>:</td>
                <td>
                    <input type="datetime-local" id="dob">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Pass">Password</label>
                </td>
                <td>:</td>
                <td>
                    <input type="password" id="Pass" minlength="8" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="File">Upload File: </label>
                </td>
                <td>:</td>
                <td>
                    <input type="File" id="File">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Gender</label>
                </td>
                <td>:</td>
                <td>
                    <label for="male">
                        <input type="radio" value="male" id="male" name="gender">Male
                    </label>
                    <label for="female">
                        <input type="radio" value="female" id="female" name="gender">Female
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Skill</label>
                </td>
                <td>:</td>
                <td>
                    <label for="html">
                        <input type="checkbox" value="HTML" id="html" name="skill">HTML
                    </label>
                    <label for="css">
                        <input type="checkbox" value="CSS" id="css" name="skill">CSS
                    </label>
                    <label for="js">
                        <input type="checkbox" value="JS" id="js" name="skill">JavaScript
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Your Country</label>
                </td>
                <td>:</td>
                <td>
                    <select name="" id="">
                        <option value="">--select your country--</option>
                        <option value="Bangladesh">Bangladesh</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="India">India</option>
                        <option value="Dubai">Dubai</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Your Comment</label>
                </td>
                <td>:</td>
                <td>
                    <textarea name="" id="" placeholder="Enter Comment" cols="20" rows="3"></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td>
                    <input type="image" src="./1.png" width="100">
                    <input type="reset">
                    <!-- <input type="submit"> -->
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
